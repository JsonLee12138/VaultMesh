name: Resume R2 test update publication

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed Publish R2 test update run containing successful build artifacts"
        required: true
        type: string
      version:
        description: "SemVer without a leading v"
        required: true
        type: string
      notes:
        description: "Short tester-facing release notes"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: vaultmesh-r2-test-updates
  cancel-in-progress: false

jobs:
  publish:
    name: Resume immutable artifacts then test channel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
      RELEASE_NOTES: ${{ inputs.notes }}
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate source build run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Source run ID must be numeric." >&2
            exit 1
          fi
          source_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          jq -e '
            .name == "Publish R2 test update" and
            .event == "workflow_dispatch" and
            .head_branch == "main" and
            .status == "completed"
          ' <<< "$source_run" >/dev/null
          source_jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs" --paginate)"
          for platform in darwin-aarch64 darwin-x86_64 windows-x86_64; do
            jq -e --arg name "Build ${platform}" '
              [.jobs[] | select(.name == $name and .status == "completed" and .conclusion == "success")] | length == 1
            ' <<< "$source_jobs" >/dev/null
          done
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          pattern: vaultmesh-update-*
          path: ${{ runner.temp }}/vaultmesh-update
          merge-multiple: true
      - name: Install isolated R2 upload client
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/vaultmesh-awscli"
          "$RUNNER_TEMP/vaultmesh-awscli/bin/pip" install \
            --disable-pip-version-check \
            --quiet \
            awscli==1.44.87
          echo "$RUNNER_TEMP/vaultmesh-awscli/bin" >> "$GITHUB_PATH"
      - name: Validate channel and build publication
        run: |
          set -euo pipefail
          current_manifest="$RUNNER_TEMP/current-latest.json"
          current_status="$(curl --silent --show-error --output "$current_manifest" --write-out '%{http_code}' "${R2_PUBLIC_BASE_URL%/}/channels/test/latest.json")"
          if [[ "$current_status" == "404" ]]; then
            rm -f "$current_manifest"
          elif [[ "$current_status" != "200" ]]; then
            echo "Unable to read current test channel (HTTP $current_status)." >&2
            exit 1
          fi
          arguments=(
            --input "$RUNNER_TEMP/vaultmesh-update"
            --output "$RUNNER_TEMP/vaultmesh-publication"
            --version "$RELEASE_VERSION"
            --base-url "$R2_PUBLIC_BASE_URL"
            --notes "$RELEASE_NOTES"
          )
          if [[ -s "$current_manifest" ]]; then
            arguments+=(--current "$current_manifest")
          fi
          node scripts/create-update-manifest.mjs "${arguments[@]}"
      - name: Publish immutable version objects
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          while IFS=$'\t' read -r source key content_type sha256; do
            [[ -n "$source" && -n "$key" && -n "$content_type" && -n "$sha256" ]]
            existing_sha256="$(aws s3api head-object --endpoint-url "$endpoint" --bucket "$R2_BUCKET" --key "$key" --query 'Metadata.sha256' --output text 2>/dev/null || true)"
            if [[ "$existing_sha256" == "None" ]]; then
              echo "Refusing to overwrite immutable R2 object without matching digest metadata: $key" >&2
              exit 1
            elif [[ -n "$existing_sha256" ]]; then
              if [[ "$existing_sha256" != "$sha256" ]]; then
                echo "Refusing to overwrite immutable R2 object with different content: $key" >&2
                exit 1
              fi
              echo "Immutable object already matches; skipping: $key"
              continue
            fi
            aws s3 cp "$source" "s3://${R2_BUCKET}/${key}" \
              --endpoint-url "$endpoint" \
              --content-type "$content_type" \
              --cache-control "public, max-age=31536000, immutable" \
              --metadata "sha256=$sha256" \
              --no-progress
          done < "$RUNNER_TEMP/vaultmesh-publication/immutable.tsv"
      - name: Publish latest.json last and verify
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          source="$RUNNER_TEMP/vaultmesh-publication/latest.json"
          aws s3 cp "$source" "s3://${R2_BUCKET}/channels/test/latest.json" \
            --endpoint-url "$endpoint" \
            --content-type "application/json" \
            --cache-control "no-store, max-age=0" \
            --no-progress
          downloaded="$RUNNER_TEMP/published-latest.json"
          aws s3 cp "s3://${R2_BUCKET}/channels/test/latest.json" "$downloaded" \
            --endpoint-url "$endpoint" \
            --no-progress
          cmp "$source" "$downloaded"

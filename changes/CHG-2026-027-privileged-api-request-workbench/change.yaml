security_impact: "Introduces outbound authenticated network execution. The Rust runtime must canonicalize and bind the destination, revalidate the live profile and credential before use, inject auth after the renderer boundary, bound and redact responses, and clear request/response buffers on cancellation, lock, timeout, Vault switch or exit."
migration: "No automatic request/history migration. API Profile from CHG-2026-026-structured-api-profiles is required. Request and response bodies are memory-only by default; saved templates, if later accepted, must be non-secret structured mutations with an explicit format decision. Existing Agent HTTP permissions and contracts are not reused or broadened."

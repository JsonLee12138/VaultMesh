security_impact: "Firefox remains a transient remote UI and receives no Vault key or persistent secret. The native host must authenticate the exact compiled Chrome extension ID or Firefox Gecko ID and reject every other launch argument before loading the pairing secret."
migration: "No Vault/RPC/ABI migration. Existing Chrome/Edge installations remain compatible; desktop installers add a separate Firefox native manifest and per-user registration. Firefox Passkey proxy remains unsupported because webAuthenticationProxy is Chromium-specific."

  - "local stdio MCP clients including Codex and OpenCode"
security_impact: "Adds a user-managed API Environment in the VaultMesh desktop UI and exposes only allowlisted safe metadata for every live Environment to Agent discovery: opaque environment reference, labels/capabilities and the optional user-entered openapiUrl. Directory visibility grants no action authority; independent Agent unlock, risk-aware Action Lease and applicable fresh confirmation remain mandatory. Target, base path, fixed headers, auth method and credential values remain Rust/core-owned and are not returned to Agent discovery. The Agent cannot create, edit or retrieve environment fields, headers, auth configuration or secrets. ADR-0015 records the intentional replacement of part of ADR-0011's direct access-token target ownership; this Work adds configuration and discovery only, while protected request injection/execution remains gated on CHG-2026-028."
migration: "No existing Secret is copied or retyped automatically. Users explicitly bind existing credential items to an API Environment. The pre-release agentEnabled field is ignored and removed by the current writer; previously disabled live Environments become discoverable but inherit no permission, and their first action remains Ask. Direct access-token Agent HTTP remains an explicit compatibility path until CHG-2026-028; connection/persistent permissions never migrate across the owner change. Format-3 records follow ADR-0015; unsupported old development writers have no supported read/write or downgrade path."

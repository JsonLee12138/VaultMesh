affected_formats:
  - "Vault format 3 encrypted API environment/auth-binding/injected-header records per ADR-0015; unsupported old development writers are refused and live revalidation prevents orphan authority"
  - "Agent safe account catalog adds an opaque api-environment kind and catalog revision"
affected_versions:

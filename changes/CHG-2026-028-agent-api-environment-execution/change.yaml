security_impact: "Changes Agent authenticated HTTP from direct access-token target ownership to an opaque API Environment account. The Agent supplies only environmentRef and bounded business request fields; the Rust broker injects canonical target, base path, fixed headers, auth strategy and all credential values. Environment/config/credential drift invalidates plans and permissions before secret use."
migration: "Requires CHG-2026-026-structured-api-profiles. Existing direct access-token Agent accounts and persistent HTTP permissions must not be silently reinterpreted as environment accounts. Before Accepted, choose explicit conversion or coexistence; recommended behavior is user-created Environment plus fresh Ask, with no permission migration. Unknown old/new registry, predicate or environment revisions fail closed."

security_impact: "Deleting the repository removes repository-scoped security configuration and audit context. The replacement must re-enable secret scanning, push protection, and private vulnerability reporting before completion. Draft release assets are backed up locally and are not uploaded to the replacement repository."
migration: "The same atlantis-mk/VaultMesh URL is recreated with a new GitHub repository identity. Only the current clean PolyForm main history is pushed. Old PRs, Actions runs, releases, settings, and GitHub repository-scoped references are not migrated. Existing external clones and archives remain outside project control."

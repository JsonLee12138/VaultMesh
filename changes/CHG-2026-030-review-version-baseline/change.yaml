security_impact: "Review artifacts continue to require Tauri updater signatures. The review channel uses the existing public verification key and CI-only private key, but remains isolated from the existing test channel so a lower version cannot overwrite or downgrade installed test builds. Gmail Desktop OAuth Client ID is injected from a CI Secret into the public-client binary; it is not an authentication secret, and OAuth authority continues to rely on PKCE, state and loopback callback validation."
migration: "0.0.1-review is a fresh-install Review baseline. Existing 0.1.x test installations cannot auto-downgrade and must be manually replaced if they join the Review channel; Vault format, settings, pairing, RPC and ABI are unchanged."

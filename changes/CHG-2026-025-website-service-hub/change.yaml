security_impact: "Adds an encrypted navigation and organization layer plus a local automatic aggregation pass over existing safe item metadata. Automatic grouping may change only Service navigation relationships; it must never create API Environments, enable Agent access, expand autofill/Passkey/HTTP/SSH targets, copy credentials or become a permission owner. Existing item-level URI, website, origin and protected-value rules remain authoritative."
migration: "On user confirmation, scan existing format-3 safe item metadata locally with exact-host rule v1, derive a deterministic aggregation plan for high-confidence matches, show aggregate counts/conflicts, and atomically create Service records and links without editing source items. Ambiguous and unkeyed items remain in review/ungrouped queues. Re-running is idempotent, and the applied batch supports rollback plus merge/split correction. Service collections are additive encrypted format-3 metadata; old development writers are unsupported per ADR-0014."

security_impact: "Stores recovery codes only inside the encrypted Login payload; every desktop or extension reveal/copy reauthenticates in core, extension reveal is current-popup-only, copy stays in the privileged expiring clipboard path, selected UTF-8 file content/path stay bounded to Rust, and source deletion requires native confirmation plus an unchanged-file check."
migration: "Envelope format remains 1. Older payloads default recovery_codes to an empty list; rollback clients can unlock the Vault but cannot present or preserve the new field and may drop it on any subsequent Vault save. Browser RPC remains v2 with three additive recovery-code operations; older extensions keep existing workflows, while a newer extension connected to an older desktop receives unsupported-operation and must keep any edit draft without claiming disclosure, copy, or deletion."

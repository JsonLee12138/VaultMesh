[[permission]]
identifier = "allow-desktop-invoke"
description = "Allows the bundled main window to invoke the validated VaultMesh dispatcher."
commands.allow = ["desktop_invoke"]

[[permission]]
identifier = "allow-desktop-activity"
description = "Allows the bundled main window to refresh the idle-lock deadline."
commands.allow = ["desktop_activity"]

[[permission]]
identifier = "allow-desktop-authentication"
description = "Allows only the main window to manage its non-secret native authentication presentation."
commands.allow = ["desktop_authentication_status", "desktop_authentication_begin", "desktop_authentication_layout", "desktop_authentication_cancel"]
